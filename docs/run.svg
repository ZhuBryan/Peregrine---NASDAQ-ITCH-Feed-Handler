0 | depth 24 x 24 levels</text></g><g id="g15"><text x="0" textLength="184" class="foreground">wall time       0.167 s</text></g><g id="g16"><text x="0" textLength="376" class="foreground">throughput      10.3 M msgs/s (97.0 ns/msg avg)</text></g><g id="g17"><text x="0" textLength="864" class="foreground">feed latency    p50 91  p99 351  p99.9 591  max 479292 ns (decode + book + publish; includes one clock read)</text></g><g id="g18"><text x="0" textLength="872" class="foreground">queue latency   p50 141  p99 21360  p99.9 185565  max 534345 ns (publish to consume; includes one clock read)</text></g></defs><g id="screen_view"><g><rect x="0" y="0" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="0"/></g><g><use xlink:href="#g2" y="408"/><rect x="0" y="425" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="425"/></g><g><use xlink:href="#g2" y="816"/><use xlink:href="#g3" y="833"/><rect x="0" y="850" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="850"/></g><g><use xlink:href="#g2" y="1224"/><use xlink:href="#g3" y="1241"/><use xlink:href="#g4" y="1258"/><rect x="0" y="1275" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="1275"/></g><g><use xlink:href="#g2" y="1632"/><use xlink:href="#g3" y="1649"/><use xlink:href="#g4" y="1666"/><use xlink:href="#g4" y="1683"/><rect x="0" y="1700" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="1700"/></g><g><use xlink:href="#g2" y="2040"/><use xlink:href="#g3" y="2057"/><use xlink:href="#g4" y="2074"/><use xlink:href="#g4" y="2091"/><use xlink:href="#g5" y="2108"/><rect x="0" y="2125" width="8" height="17" class="foreground"/><use xlink:href="#g1" y="2125"/></g><g><use xlink:href="#g2" y="2448"/><use xlink:href="#g3" y="2465"/><use xlink:href="#g4" y="2482"/><use xlink:href="#g4" y="2499"/><use xlink:href="#g5" y="2516"/><use xlink:href="#g6" y="2533"/><use xlink:href="#g7" y="2550"/><use xlink:href="#g8" y="2567"/><rect x="0" y="2584" width="8